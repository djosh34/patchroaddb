# Temporary: builds pkg/sim for gosim and replays one seed while outcome 10
# is built. Removed before the PR merges.
name: sim-dev

on:
  push:
    branches: [work/58-simulation]

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      # gosim keeps its translation of each package in this database, so a
      # build translates only the packages that changed since the last one.
      # It is saved even when the build fails, for the next try.
      - uses: actions/cache/restore@v4
        with:
          path: .gosim/cache.sqlite3
          key: sim-gosim-${{ github.sha }}
          restore-keys: sim-gosim-
      # Translating the tree peaks near the runner's 16 GB of memory; the
      # swap keeps the kernel from stopping the job.
      - name: Add 8 GB of swap
        run: |
          sudo fallocate -l 8G /swap-sim
          sudo chmod 600 /swap-sim
          sudo mkswap /swap-sim >/dev/null
          sudo swapon /swap-sim
          free -g
      - name: Build
        run: /usr/bin/time -v build/sim-build.sh bin/sim
        env:
          GOSIM_TRANSLATE_WORKERS: "8"
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .gosim/cache.sqlite3
          key: sim-gosim-${{ github.sha }}
      - name: Replay seed 1
        run: |
          set -o pipefail
          cd pkg/sim
          SIM_BINARY=$GITHUB_WORKSPACE/bin/sim/sim-gosim.test SIM_SEED=1 SIM_OUT=$RUNNER_TEMP/out SIM_WALL_MINUTES=8 \
            /usr/bin/time -v $GITHUB_WORKSPACE/bin/sim/sim.test -test.run '^TestReplay$' -test.v -test.timeout 100m 2>&1 | tail -300
      - name: Memory of 40 seeds in one process
        if: always()
        run: |
          mkdir -p $RUNNER_TEMP/out
          cd pkg/sim
          SIM_BINARY=$GITHUB_WORKSPACE/bin/sim/sim-gosim.test SIM_FIRST=1 SIM_COUNT=40 SIM_OUT=$RUNNER_TEMP/out/mem \
            $GITHUB_WORKSPACE/bin/sim/sim.test -test.run '^TestCampaign$' -test.v -test.timeout 60m > $RUNNER_TEMP/out/mem-run.txt 2>&1 &
          pid=$!
          while kill -0 $pid 2>/dev/null; do
            echo "$(date +%T) $(ps -C sim-gosim.test -o rss= | awk '{s+=$1} END {printf "%d MB", s/1024}') $(free -m | awk '/Mem:/ {print "used " $3 " MB"}') $(grep -c '^    campaign_test.go:.*seed [0-9]*: failed' $RUNNER_TEMP/out/mem-run.txt) seeds"
            sleep 15
          done | tee $RUNNER_TEMP/out/mem.txt
          wait $pid; echo "exit $?"
          grep -E "seed [0-9]+:|seeds, |FAIL" $RUNNER_TEMP/out/mem-run.txt | tail -45
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed
          path: ${{ runner.temp }}/out

  chaos:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - run: go build -o bin/patchroaddb ./pkg/cmd/patchroaddb
      - run: build/ci/chaos.sh bin/patchroaddb "$RUNNER_TEMP/chaos"
        env:
          CHAOS_MINUTES: "3"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos
          path: ${{ runner.temp }}/chaos
