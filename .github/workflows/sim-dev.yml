# Temporary: builds pkg/sim for gosim and replays one seed while outcome 10
# is built. Removed before the PR merges.
name: sim-dev

on:
  push:
    branches: [work/58-simulation]

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      # gosim keeps its translation of each package in this database, so a
      # build translates only the packages that changed since the last one.
      # It is saved even when the build fails, for the next try.
      - uses: actions/cache/restore@v4
        with:
          path: .gosim/cache.sqlite3
          key: sim-gosim-${{ github.sha }}
          restore-keys: sim-gosim-
      - name: Build
        run: /usr/bin/time -v build/sim-build.sh bin/sim
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .gosim/cache.sqlite3
          key: sim-gosim-${{ github.sha }}
      - name: List the unimplemented hooks the binary reaches
        continue-on-error: true
        run: .gosim/bin/gosim build-tests -tags noasm,disableunsafe -allow-unimplemented /dev/null ./pkg/sim 2>&1 | tail -200
      - name: Replay seed 1
        run: |
          set -o pipefail
          cd pkg/sim
          SIM_BINARY=$GITHUB_WORKSPACE/bin/sim/sim-gosim.test SIM_SEED=1 SIM_OUT=$RUNNER_TEMP/out \
            /usr/bin/time -v $GITHUB_WORKSPACE/bin/sim/sim.test -test.run '^TestReplay$' -test.v -test.timeout 100m 2>&1 | tail -300
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed
          path: ${{ runner.temp }}/out

  chaos:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - run: go build -o bin/patchroaddb ./pkg/cmd/patchroaddb
      - run: build/ci/chaos.sh bin/patchroaddb "$RUNNER_TEMP/chaos"
        env:
          CHAOS_MINUTES: "3"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos
          path: ${{ runner.temp }}/chaos
