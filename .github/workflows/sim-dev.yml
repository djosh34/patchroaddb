# Temporary: builds pkg/sim for gosim and replays one seed while outcome 10
# is built. Removed before the PR merges.
name: sim-dev

on:
  push:
    branches: [work/58-simulation]

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      # gosim keeps its translation of each package in this database, so a
      # build translates only the packages that changed since the last one.
      # It is saved even when the build fails, for the next try.
      - uses: actions/cache/restore@v4
        with:
          path: .gosim/cache.sqlite3
          key: sim-gosim-${{ github.sha }}
          restore-keys: sim-gosim-
      # Translating the tree peaks near the runner's 16 GB of memory; the
      # swap keeps the kernel from stopping the job.
      - name: Add 8 GB of swap
        run: |
          sudo fallocate -l 8G /swap-sim
          sudo chmod 600 /swap-sim
          sudo mkswap /swap-sim >/dev/null
          sudo swapon /swap-sim
          free -g
      - name: Build
        run: /usr/bin/time -v build/sim-build.sh bin/sim
        env:
          GOSIM_TRANSLATE_WORKERS: "8"
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .gosim/cache.sqlite3
          key: sim-gosim-${{ github.sha }}
      - name: List the unimplemented hooks the binary reaches
        continue-on-error: true
        run: .gosim/bin/gosim build-tests -tags noasm,disableunsafe -allow-unimplemented /dev/null ./pkg/sim 2>&1 | tail -200
        env:
          GOSIM_TRANSLATE_WORKERS: "8"
      - name: Replay seed 1
        run: |
          set -o pipefail
          cd pkg/sim
          SIM_BINARY=$GITHUB_WORKSPACE/bin/sim/sim-gosim.test SIM_SEED=1 SIM_OUT=$RUNNER_TEMP/out SIM_WALL_MINUTES=8 \
            /usr/bin/time -v $GITHUB_WORKSPACE/bin/sim/sim.test -test.run '^TestReplay$' -test.v -test.timeout 100m 2>&1 | tail -300
      - name: Profile seed 1
        if: always()
        continue-on-error: true
        run: |
          sudo apt-get install -y -q linux-tools-common "linux-tools-$(uname -r)" >/dev/null || sudo apt-get install -y -q linux-tools-generic >/dev/null
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          PERF=$(ls /usr/lib/linux-tools/*/perf | head -1)
          mkdir -p $RUNNER_TEMP/out
          timeout 15m $PERF record -F 199 -g -o $RUNNER_TEMP/perf.data -- \
            bin/sim/sim-gosim.test -test.run '^TestSeed$' -seeds 1 > $RUNNER_TEMP/out/profile-run.txt 2>&1 || true
          tail -5 $RUNNER_TEMP/out/profile-run.txt
          $PERF report -i $RUNNER_TEMP/perf.data --no-children --sort symbol --stdio -g none 2>/dev/null | head -150 | tee $RUNNER_TEMP/out/profile-self.txt
          $PERF report -i $RUNNER_TEMP/perf.data --children --sort symbol --stdio -g none 2>/dev/null | head -300 > $RUNNER_TEMP/out/profile-children.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed
          path: ${{ runner.temp }}/out

  chaos:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - run: go build -o bin/patchroaddb ./pkg/cmd/patchroaddb
      - run: build/ci/chaos.sh bin/patchroaddb "$RUNNER_TEMP/chaos"
        env:
          CHAOS_MINUTES: "3"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos
          path: ${{ runner.temp }}/chaos
